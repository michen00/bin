---
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -el {0}

jobs:
  test:
    name: Run Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Setup BATS
        uses: bats-core/bats-action@4.0.0
      - name: Install bash and GNU parallel (macOS only)
        if: matrix.os == 'macos-latest'
        run: |
          brew install bash parallel
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Verify bash version
        if: matrix.os == 'macos-latest'
        run: |
          echo "Resolved bash: $(which bash)"
          bash -c 'echo "BASH_VERSION=$BASH_VERSION"'
      - name: Run BATS tests
        run: bats --jobs 4 --timing tests/*.bats
      - name: Run root-script tests under /bin/bash (macOS only)
        # Principle V requires the root scripts to run on macOS's bash 3.2.
        # With /bin first on PATH, `#!/usr/bin/env bash` resolves to
        # /bin/bash. validate-scripts.bats is excluded because the script
        # that it tests requires bash 4.4.
        if: matrix.os == 'macos-latest'
        run: |
          PATH="/bin:$PATH" bash -c 'echo "BASH_VERSION=$BASH_VERSION"'
          tests=()
          for test_file in tests/*.bats; do
            [[ $test_file == tests/validate-scripts.bats ]] ||
              tests+=("$test_file")
          done
          PATH="/bin:$PATH" bats --timing "${tests[@]}"

  run-ci:
    name: Run CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install pre-commit
        run: |
          pip install --upgrade pip
          pip install --upgrade pre-commit
      - name: Cache pre-commit hooks
        id: cache-pre-commit-hooks
        uses: actions/cache@v6
        env:
          CACHE_NUMBER: 1
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-precommit-${{ hashFiles('.pre-commit-config.yaml') }}-${{ env.CACHE_NUMBER }} # yamllint disable-line rule:line-length
      - name: Install pre-commit hook environments
        if: steps.cache-pre-commit-hooks.outputs.cache-hit != 'true'
        run: |
          pre-commit install-hooks
      - name: Run pre-commit hooks
        run: |
          pre-commit run --all-files
