---
name: PR body unwrap

# The pull-request-body half of what the pre-commit hooks CI.yml already runs
# enforce on every tracked Markdown file: no manual line breaks inside a
# paragraph. A pull request body is not a tracked file, so that hook cannot
# reach it -- an author who hard-wraps a draft in an editor or a shell
# heredoc publishes the ragged result to every reviewer, with nothing here to
# catch it.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

jobs:
  edit:
    permissions:
      pull-requests: write
    # v0.5.0
    uses: >-
      michen00/markdown-prose-hooks/.github/workflows/unwrap-pr-body.yml@74e6a1e1df1b14a2053dfb62b3e29c770538b61c
