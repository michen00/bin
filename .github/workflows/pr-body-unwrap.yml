---
name: PR body unwrap

# The pull-request-body half of what the pre-commit hooks CI.yml already runs
# enforce on every tracked Markdown file: no manual line breaks inside a
# paragraph. A pull request body is not a tracked file, so that hook cannot
# reach it -- an author who hard-wraps a draft in an editor or a shell
# heredoc publishes the ragged result to every reviewer, with nothing here to
# catch it.
#
# Calls the published reusable workflow rather than reimplementing the
# transform: michen00/markdown-prose-hooks/.github/workflows/unwrap-pr-body.yml,
# documented under "On a pull request body" in that project's README. It
# rewrites, so it accepts only pull_request_target -- a pull_request run would
# read the workflow from the PR's own tree, and that file is what grants the
# token.
#
# opened, reopened, ready_for_review only, matching the reusable workflow's
# own guidance: running on every push would overwrite what the author had
# typed since. pr-body-unwrap-check.yml covers synchronize and edited instead.
#
# Pinned to v0.5.0, the first release carrying this reusable workflow -- an
# earlier tag can look newest-at-the-time and still predate the file, so the
# ref was verified to actually contain it rather than assumed from being the
# latest release.
#
# A bot-authored or empty body is skipped by the reusable workflow itself, so
# nothing here repeats that exemption.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

jobs:
  edit:
    permissions:
      pull-requests: write
    # v0.5.0
    uses: >-
      michen00/markdown-prose-hooks/.github/workflows/unwrap-pr-body.yml@74e6a1e1df1b14a2053dfb62b3e29c770538b61c
