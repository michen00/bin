---
name: PR catchup

# Merges main into each open, non-conflicting pull request branch from this repository,
# with michen00/pr-catchup. An App token (vars.APP_CLIENT_ID, secrets.APP_PRIVATE_KEY)
# makes the merges; without one, the action merges with GITHUB_TOKEN and approves the
# runs that GitHub holds for approval.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-catchup
  cancel-in-progress: false

jobs:
  catchup:
    # A dispatch runs this file from the dispatched ref with write access, so allow only
    # the default branch.
    if: >-
      github.event_name != 'workflow_dispatch'
      || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write # approve runs when a merge falls back to GITHUB_TOKEN
      contents: write # create the merge commits when it falls back
      pull-requests: read # list pull requests and read mergeable
    steps:
      # Missing or invalid App credentials fall back to GITHUB_TOKEN.
      - name: Mint an App token, if one is configured
        id: app-token
        if: vars.APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Update behind PR branches
        uses: michen00/pr-catchup@344764a9d676de7b766682fa423e59df56d15818 # v0.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}
