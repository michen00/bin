---
ci:
  autofix_commit_msg: |
    chore: autofix via pre-commit hooks

    for more information, see https://pre-commit.ci
  autoupdate_commit_msg: |
    chore: autoupdate pre-commit hooks

    for more information, see https://pre-commit.ci

default_stages: [pre-commit]
repos:
  # maintenance
  - repo: https://github.com/pre-commit/sync-pre-commit-deps
    rev: v0.0.5
    hooks:
      - id: sync-pre-commit-deps

  # security (fail fast)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        fail_fast: true
  - repo: https://github.com/thoughtworks/talisman
    rev: v1.37.0
    hooks:
      - id: talisman-push # pre-push
        fail_fast: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
        fail_fast: true

  # git commit policy
  - repo: https://github.com/michen00/custom-commit-hooks
    rev: v0.1.2
    hooks:
      - id: enhance-scope # commit-msg
      - id: conventional-merge-commit # prepare-commit-msg
  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint

  # hygiene (cheap, non-formatting)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: mixed-line-ending

  # formatting before linting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.8
    hooks:
      - id: prettier
        types_or: [yaml, markdown, html, css, scss, javascript, json]
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
  # One paragraph is one line, so a diff to a paragraph is one line. Ordered before
  # markdownlint below, so that what markdownlint --fix sees is the final text rather
  # than a shape about to change under it.
  #
  # The two do not compete, and the reason is worth stating because the hook's own
  # readme warns about exactly this: a rule that wraps prose and a hook that unwraps
  # it undo each other forever. The wrapping rules are markdownlint's line-length and
  # Prettier's proseWrap. Here line-length is false in .markdownlint.yml, and Prettier
  # does see Markdown (it's in types_or above) but its proseWrap default is preserve,
  # so it never rewraps prose either -- nothing here is pulling the other way.
  #
  # The writing id rather than the -check one: nothing else in this tree reflows
  # prose, so the hook can hold the convention instead of only reporting on it.
  - repo: https://github.com/michen00/markdown-prose-hooks-py
    rev: v0.5.0
    hooks:
      - id: unwrap-markdown-prose-py
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: ['--fix']

  # linting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-toml
      - id: check-yaml

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]
  - repo: https://github.com/adhtruong/mirrors-typos
    rev: v1.50.2
    hooks:
      - id: typos
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # configuration validation
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: '0.26'
    hooks:
      - id: validate-pyproject
        additional_dependencies: ['validate-pyproject-schema-store[all]']
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      - id: check-dependabot
      - id: check-github-workflows
